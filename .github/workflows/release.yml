name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION_WARNING: 'false'
  ACTIONS_RUNNER_FORCE_NODE24: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'false'

jobs:
  validate-release:
    runs-on: windows-latest
    env:
      ACTIONS_RUNNER_FORCED_NODE_VERSION_WARNING: 'false'
      ACTIONS_RUNNER_FORCE_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate frontend
        working-directory: app
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'frontend-validation.log'
          & npx tsc --noEmit --pretty false 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content $logPath | Select-Object -Last 20) -join '%0A'
            Write-Output "::error title=Frontend validation::$details"
            exit $LASTEXITCODE
          }

      - name: Validate updater signing configuration
        working-directory: app
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'updater-signing-validation.log'
          & npm run test:updater-signing-key 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content $logPath | Select-Object -Last 20) -join '%0A'
            Write-Output "::error title=Updater signing validation::$details"
            exit $LASTEXITCODE
          }

      - name: Record validation context
        shell: pwsh
        run: |
          $context = [ordered]@{
            ref = $env:GITHUB_REF
            sha = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            node = (& node --version)
            npm = (& npm --version)
            rustc = (& rustc --version)
            cargo = (& cargo --version)
            tauri_cli = (& npm --prefix app exec tauri -- --version)
          }
          $context | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'release-context.json')
          "## Release validation context" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          ($context | ConvertTo-Json) | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Validate release version and changelog
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH. Received v$version"
          }

          & npm --prefix app run test:versions
          if ($LASTEXITCODE -ne 0) {
            throw "Version unit tests failed"
          }

          & node app/scripts/verify-versions.js $version
          if ($LASTEXITCODE -ne 0) {
            throw "Version synchronization validation failed for version $version"
          }

          $lines = Get-Content CHANGELOG.md
          $headerLine = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -eq "## [$version]") {
              $headerLine = $index
              break
            }
          }
          if ($headerLine -lt 0) { throw "CHANGELOG.md does not contain ## [$version]" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($index = $headerLine + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## \[') { break }
            $body.Add($lines[$index])
          }
          if (-not ($body -join "`n").Trim()) { throw "CHANGELOG.md entry for $version is empty" }

      - name: Provide MPV resource placeholder for Rust validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/bin | Out-Null
          New-Item -ItemType File -Force app/src-tauri/bin/mpv-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType Directory -Force app/src-tauri/resources/whisper | Out-Null
          New-Item -ItemType File -Force app/src-tauri/resources/whisper/.gitkeep | Out-Null

      - name: Validate Rust source
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'rust-validation.log'
          & cargo check --locked --message-format short 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content $logPath | Select-Object -Last 20) -join '%0A'
            Write-Output "::error title=Rust validation::$details"
            exit $LASTEXITCODE
          }

      - name: Upload validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontend-validation.log
            ${{ runner.temp }}/updater-signing-validation.log
            ${{ runner.temp }}/rust-validation.log
            ${{ runner.temp }}/release-context.json
          if-no-files-found: warn

  build-tauri:
    needs: validate-release
    runs-on: windows-latest
    env:
      ACTIONS_RUNNER_FORCED_NODE_VERSION_WARNING: 'false'
      ACTIONS_RUNNER_FORCE_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Setup MPV sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/bin | Out-Null
          curl.exe -fL -o mpv.zip "https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-x86_64-pc-windows-msvc.zip"
          7z e mpv.zip mpv.exe "-oapp/src-tauri/bin/"
          Move-Item -Force app/src-tauri/bin/mpv.exe app/src-tauri/bin/mpv-x86_64-pc-windows-msvc.exe
          Remove-Item mpv.zip

      - name: Setup Whisper resources
        working-directory: app
        run: node setup-whisper.js

      - name: Prepare updater signing key
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const path = require('path');
          const key = (process.env.KEY || '').trim();
          if (!key) throw new Error('TAURI_SIGNING_PRIVATE_KEY is required for a release.');
          const configPath = path.join('app', 'src-tauri', 'tauri.conf.json');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const b64 = key.startsWith('untrusted comment:')
            ? Buffer.from(key).toString('base64')
            : key.replace(/\r?\n/g, '');
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${b64}\n`);
          config.bundle ??= {};
          config.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2));

      - name: Verify updater signing key
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run verify:updater-signing-key

      - name: Build Windows installer
        working-directory: app
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'tauri-build.log'
          & npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content $logPath | Select-Object -Last 30) -join '%0A'
            Write-Output "::error title=Tauri Windows build::$details"
            exit $LASTEXITCODE
          }

      - name: Collect required release assets
        shell: pwsh
        run: |
          $bundleDir = 'app/src-tauri/target/release/bundle'
          $installer = Get-ChildItem -Path $bundleDir -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $signature = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) { throw 'Updater signature was not generated.' }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item $installer.FullName -Destination "release-assets/$($installer.Name)" -Force
          Copy-Item $signature.FullName -Destination "release-assets/$($signature.Name)" -Force

          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $manifest = [ordered]@{
            version = $version
            notes = "TeleStash $version"
            pub_date = [DateTime]::UtcNow.ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($installer.Name)"
                signature = (Get-Content $signature.FullName -Raw).Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path release-assets/latest.json -NoNewline

          $assetReport = Get-ChildItem release-assets -File | ForEach-Object {
            [ordered]@{
              name = $_.Name
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
          }
          $assetReport | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'release-assets.json')
          "## Release assets" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          ($assetReport | ConvertTo-Json) | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Upload build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tauri-build.log
            ${{ runner.temp }}/release-assets.json
          if-no-files-found: warn

  publish-release:
    needs: build-tauri
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ACTIONS_RUNNER_FORCED_NODE_VERSION_WARNING: 'false'
      ACTIONS_RUNNER_FORCE_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_VERSION;
            const version = tag.replace(/^v/, '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const start = changelog.findIndex((line) => line === `## [${version}]`);
            if (start < 0) throw new Error(`Missing CHANGELOG.md entry for ${version}.`);
            const end = changelog.findIndex((line, index) => index > start && line.startsWith('## ['));
            const body = changelog.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
            if (!body) throw new Error(`Empty CHANGELOG.md entry for ${version}.`);
            const assetDir = 'release-assets';
            const assets = fs.readdirSync(assetDir).filter((file) => file.endsWith('.exe') || file.endsWith('.sig') || file === 'latest.json');
            if (!assets.some((file) => file.endsWith('.exe')) || !assets.some((file) => file.endsWith('.sig')) || !assets.includes('latest.json')) {
              throw new Error('Required installer, signature, or latest.json is missing.');
            }

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag }));
              await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name: `TeleStash v${version}`, body, draft: true, prerelease: false });
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, name: `TeleStash v${version}`, body, draft: true, prerelease: false }));
            }

            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: release.id });
            for (const asset of existing.filter((asset) => assets.includes(asset.name))) {
              await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id });
            }
            for (const name of assets) {
              await github.rest.repos.uploadReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name, data: fs.readFileSync(path.join(assetDir, name)) });
            }
            await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, draft: false, prerelease: false });
