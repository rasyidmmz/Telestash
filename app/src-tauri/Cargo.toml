[package]
name = "telestash"
version = "1.9.1"
description = "Windows 11 x64 Telegram-backed media and file drive."
authors = ["rasyidmmz"]
edition = "2021"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = "0.10"
grammers-session = "0.10"
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
# HTTP/2 is switched off deliberately (R4 #7). actix-web's `http2` feature is
# the only path to the `h2` crate in this graph, and `h2` 0.3.27 carries
# RUSTSEC-2026-0258 ("unbounded empty DATA frames") with no patched 0.3.x
# release — even the newest actix-http still requires `h2 ^0.3.27`. TeleStash's
# REST and share/stream servers are plain HTTP/1.1 on 127.0.0.1, so dropping
# HTTP/2 removes the vulnerable code from the build instead of ignoring it.
# Every other default feature is kept.
actix-web = { version = "4", default-features = false, features = [
  "macros",
  "compress-brotli",
  "compress-gzip",
  "compress-zstd",
  "cookies",
  "unicode",
  "compat",
  "ws",
] }
actix-cors = "0.7"
actix-multipart = "0.8"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.10"
sha2 = "0.11"
# Pin rc0: grammers-crypto 0.10.0 is written against this API; 2.0.0-rc1
# breaks it (Result-returning mt:: API + num-bigint 0.5), and grammers'
# loose ^2.0.0-rc0 range would otherwise resolve the broken release candidate.
glass_pumpkin = "=2.0.0-rc1"
bcrypt = "0.19"
constant_time_eq = "0.6"
# `zip` is retained: it only *creates* archives for the REST bulk-download
# endpoint. Nothing reads untrusted archives any more.
zip = { version = "8", default-features = false, features = ["deflate"] }
sqlite = { version = "0.37.0", features = ["bundled"] }
mp4parse = "0.17"

[package.metadata.tauri.bundle.windows]
# Embed the WebView2 bootstrapper so the app works on Windows systems
# where the WebView2 runtime is not pre-installed (fresh installs, servers, etc.)
webview-install-mode = "embeddir"

[profile.release]
# Keep debug info (PDB) for crash-dump symbolization via the pdbdump tool.
# thin LTO + one codegen unit trade build time for a smaller, faster binary
# without the full-link-time cost of "fat" LTO.
debug = true
lto = "thin"
codegen-units = 1
